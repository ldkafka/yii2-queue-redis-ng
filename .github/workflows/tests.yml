name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        server: ['redis:7.4-alpine']
        include:
          - { php: '8.4', server: 'redis:5.0-alpine' }
          - { php: '8.4', server: 'redis:6.2-alpine' }
          - { php: '8.4', server: 'redis:8-alpine' }
          - { php: '8.4', server: 'valkey/valkey:8-alpine' }
    services:
      redis:
        image: ${{ matrix.server }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
